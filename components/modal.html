<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-form-wrap">
      <div class="modal-tag" id="modal-tag"></div>
      <div class="modal-title" id="modal-title">Let's get started</div>
      <div class="modal-sub" id="modal-sub">We'll follow up within a few hours. No commitment required.</div>
      <form id="form-showing" name="contact" data-netlify="true" netlify-honeypot="bot-field" style="display:block" novalidate onsubmit="return false">
        <input type="hidden" name="form-name" value="contact"/>
        <p style="display:none"><input name="bot-field"/></p>
        <div class="f-field">
          <label class="f-label" for="f-name">Full name <span style="color:var(--red)">*</span></label>
          <input class="f-input" type="text" id="f-name" name="name" autocomplete="name"/>
          <div class="f-error" id="err-name"></div>
        </div>
        <div class="f-field">
          <label class="f-label" for="f-email">Email address <span style="color:var(--red)">*</span></label>
          <input class="f-input" type="text" id="f-email" name="email" inputmode="email" autocomplete="email" maxlength="100"/>
        </div>
        <div class="f-field">
          <label class="f-label" for="f-phone">Phone number <span style="color:var(--red)">*</span></label>
          <input class="f-input" type="tel" id="f-phone" name="phone" inputmode="tel" autocomplete="tel"/>
          <div class="f-error" id="err-contact"></div>
        </div>
        <div class="f-field">
          <label class="f-label" for="f-note">Tell us what you're looking for <span style="color:var(--muted);font-size:11px">(optional)</span></label>
          <textarea class="f-textarea" id="f-note" name="note" rows="3" maxlength="2000" placeholder="I'm looking for a $1M house in Toronto"></textarea>
        </div>
        <p class="f-consent">By submitting, you agree to be contacted by HomeCashbacks. View our <a href="/privacy.html" target="_blank">Privacy Policy</a>.</p>
        <input type="hidden" id="f-source" name="source" value="buyer"/>
        <button type="button" id="f-submit" class="f-submit" onclick="handleFormSubmit('contact')">Claim My Free Consultation</button>
      </form>
    </div>
    <div class="f-success" id="form-success">
      <div class="f-success-icon">✓</div>
      <h3>We'll be in touch!</h3>
      <p>Expect a call or email from us within a few hours.</p>
    </div>
  </div>
</div>
