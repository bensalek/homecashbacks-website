<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-sub" tabindex="-1">
    <button type="button" class="modal-close" onclick="closeModal()" aria-label="Close dialog"><span aria-hidden="true">✕</span></button>
    <div id="modal-form-wrap">
      <div class="modal-tag" id="modal-tag"></div>
      <div class="modal-title" id="modal-title">Let's get started</div>
      <div class="modal-sub" id="modal-sub">Takes 30 seconds. We'll reply within a few hours. No commitment.</div>
      <form id="form-showing" name="contact" data-netlify="true" netlify-honeypot="bot-field" style="display:block" novalidate onsubmit="return false">
        <input type="hidden" name="form-name" value="contact"/>
        <p style="display:none"><input name="bot-field"/></p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="f-field">
            <label class="f-label" for="f-name">First name <span style="color:var(--red)">*</span></label>
            <input class="f-input" type="text" id="f-name" name="firstname" autocomplete="given-name" maxlength="60"/>
          </div>
          <div class="f-field">
            <label class="f-label" for="f-lastname">Last name <span style="color:var(--red)">*</span></label>
            <input class="f-input" type="text" id="f-lastname" name="lastname" autocomplete="family-name" maxlength="60"/>
          </div>
        </div>
        <div class="f-error" id="err-name" role="alert"></div>
        <div class="f-field">
          <label class="f-label" for="f-email">Email address <span style="color:var(--red)">*</span></label>
          <input class="f-input" type="text" id="f-email" name="email" inputmode="email" autocomplete="email" maxlength="100"/>
        </div>
        <div class="f-field">
          <label class="f-label" for="f-phone">Phone number <span style="color:var(--red)">*</span></label>
          <input class="f-input" type="tel" id="f-phone" name="phone" inputmode="tel" autocomplete="tel"/>
          <div class="f-error" id="err-contact" role="alert"></div>
        </div>
        <div class="f-field">
          <label class="f-label" for="f-note">Tell us what you're looking for <span style="color:var(--muted);font-size:11px">(optional)</span></label>
          <textarea class="f-textarea" id="f-note" name="note" rows="2" maxlength="2000" placeholder="I'm looking for a $1M house in Toronto"></textarea>
        </div>
        <label for="f-optin" style="display:flex;align-items:flex-start;gap:10px;margin:2px 0 12px;font-size:12px;line-height:1.5;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="f-optin" name="marketing_updates" value="yes" style="flex-shrink:0;width:16px;height:16px;margin-top:2px;accent-color:var(--cta);cursor:pointer"/>
          <span>Yes, email me occasional GTA market updates and home buying tips from Home Cashbacks. You can unsubscribe at any time.</span>
        </label>
        <p class="f-consent">By submitting, you agree to be contacted by Home Cashbacks about your inquiry. View our <a href="/privacy.html" target="_blank">Privacy Policy</a>.</p>
        <input type="hidden" id="f-source" name="source" value="buyer"/>
        <button type="button" id="f-submit" class="f-submit" onclick="handleFormSubmit('contact')">Claim My Free Consultation</button>
      </form>
    </div>
    <div class="f-success" id="form-success" role="status" aria-live="polite">
      <div class="f-success-icon">✓</div>
      <h3>We'll be in touch!</h3>
      <p>Expect a call or email from us within a few hours.</p>
    </div>
  </div>
</div>
