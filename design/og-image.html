<!doctype html>
<!-- Source for og-image.png (1200x630 social share image). Render with: node scripts/render-og-image.js -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url('../assets/fonts/cormorant-garamond-v21-latin-600.woff2') format('woff2')}
@font-face{font-family:'Rubik';font-weight:400;src:url('../assets/fonts/rubik-v31-latin-regular.woff2') format('woff2')}
@font-face{font-family:'Rubik';font-weight:500;src:url('../assets/fonts/rubik-v31-latin-500.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#1a2332;color:#fff;font-family:'Rubik',sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;right:-140px;top:-140px;width:560px;height:560px;border-radius:50%;border:80px solid rgba(28,134,78,.10)}
.glow2{position:absolute;left:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;border:56px solid rgba(28,134,78,.07)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:500}
.brand img{width:52px;height:52px;border-radius:10px}
.brand b{color:#1c864e;font-weight:500}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:92px;line-height:1.02;margin-top:64px;max-width:900px}
h1 em{color:#34c070;font-style:italic}
.sub{margin-top:28px;font-size:30px;color:rgba(232,237,245,.78);max-width:820px;line-height:1.4}
.foot{margin-top:auto;display:flex;align-items:center;gap:20px;font-size:24px;color:rgba(232,237,245,.7)}
.foot img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #1c864e}
.foot strong{color:#fff;font-weight:500}
.pill{margin-left:auto;background:#1c864e;color:#fff;padding:14px 26px;border-radius:8px;font-weight:500;font-size:26px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div class="brand"><img src="../favicon.svg" alt=""><span>Home<b>Cashbacks</b></span></div>
  <h1>Buy a home in Toronto.<br><em>Keep the commission.</em></h1>
  <p class="sub">Flat $4,999 fee. The rest of the buyer agent commission comes back to you after closing.</p>
  <div class="foot">
    <img src="../assets/headshot.webp" alt="">
    <div><strong>Laleh Mousavi, Realtor</strong><br>Smart Brokerages &middot; Licensed with RECO</div>
    <div class="pill">homecashbacks.ca</div>
  </div>
</div>
</body></html>
