name: Submit Sitemap URLs to IndexNow

on:
  push:
    branches:
      - main

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment
        run: sleep 60

      - name: Download sitemap
        run: |
          curl -s https://homecashbacks.ca/sitemap.xml -o sitemap.xml

      - name: Extract URLs
        run: |
          grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "Found $COUNT URLs in sitemap."
          cat urls.txt

      - name: Submit to IndexNow
        run: |
          jq -Rs '
            split("\n")[:-1] |
            {
              host:"homecashbacks.ca",
              key:"'"${{ secrets.INDEXNOW_KEY }}"'",
              keyLocation:"https://homecashbacks.ca/'"${{ secrets.INDEXNOW_KEY }}"'.txt",
              urlList: .
            }
          ' urls.txt > payload.json

          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json)

          echo "$response"

          status=$(echo "$response" | grep HTTP_STATUS | cut -d: -f2)

          case "$status" in
            200|202)
              COUNT=$(wc -l < urls.txt)
              echo "✅ IndexNow accepted $COUNT URLs (HTTP $status)"
              ;;
            *)
              echo "❌ IndexNow submission failed (HTTP $status)"
              echo "$response"
              exit 1
              ;;
          esac